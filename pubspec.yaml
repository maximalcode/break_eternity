name: break_eternity
description: >-
  Big numbers for idle and incremental games: a faithful Dart port of
  break_eternity.js, representing values up to 10^^1e308 with fast,
  constant-time arithmetic.
version: 0.1.0
repository: https://github.com/maximalcode/break_eternity
issue_tracker: https://github.com/maximalcode/break_eternity/issues

topics:
  - math
  - numbers
  - game-development
  - games

# 3.8 is the floor `lints ^6.0.0` imposes, and CI tests exactly this version so
# the constraint stays honest. The library code itself needs nothing newer.
environment:
  sdk: ^3.8.0

# Lower bounds are the oldest versions that actually resolve and pass, not the
# oldest that look plausible: `dart pub downgrade && dart test` is part of CI,
# and pub.dev scores it.
dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
